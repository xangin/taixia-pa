substitutions:
  devicename: climate-p
  upper_devicename: "Climate-P"
  model_name: "Climate"
  status_led_pin: GPIO8
  tx_pin: GPIO7 #21 #pin3 (RX to AC)
  rx_pin: GPIO6 #20 #pin4 (TX from AC)
  led_pin: GPIO8


esphome:
  name: $devicename
  friendly_name: ${upper_devicename}
  comment: ESP32C3 for $model_name
  name_add_mac_suffix: false
  project:
    name: "TaiSEIA-Panasonic.$model_name"
    version: "ESP32C3" #hardware

external_components:
  - source: github://xangin/taixia-pa@master
    components: [ taixia ]

esp32:
  variant: ESP32C3
  framework:
    type: esp-idf

uart:
  id: uart_taixia
  tx_pin: $tx_pin
  rx_pin: $rx_pin
  baud_rate: 9600

status_led:
  pin:
    number: $led_pin # Blue LED   
    inverted: True

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${devicename}
    password: "12345678"

captive_portal:

# Enable logging
logger:
  baud_rate: 0 # disable serial logging;

# Enable Home Assistant API
api:

ota:
  - platform: esphome

status_led:
  pin:
    number: $status_led_pin

button:
  - platform: safe_mode
    name: Safe Mode Boot
    entity_category: diagnostic

  - platform: restart
    name: "Restart"

  - platform: taixia
    type: airconditioner
    get_info:
      name: "Get Info"
    energy_reset:
      name: "Reset Energy"
    filter_clean_notify:
      name: "Clear Filter Notify"

climate:
  - platform: taixia
    id: ac_climate
    name: "Climate"
    supported_modes:
      - COOL
      - HEAT
      - DRY
      - FAN_ONLY
    supported_fan_modes:
      - LOW
      - MEDIUM
      - HIGH
      - AUTO
    supported_swing_modes:
      - VERTICAL
      - HORIZONTAL
      - BOTH
    supported_presets:
      - NONE
      - BOOST
      - ACTIVITY
      - SLEEP

number:
  - platform: taixia
    type: airconditioner
    off_timer:
      name: "Off Timer"
    on_timer:
      name: "On Timer"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    filters:
      - lambda: return x / 3600;
    unit_of_measurement: "h"
    accuracy_decimals: 1

  - platform: internal_temperature
    name: "ESP32 Temperature"

  - platform: taixia
    type: airconditioner
    update_interval: 10s
    temperature_indoor:
      name: "Temperature Indoor"
    temperature_outdoor:
      name: "Temperature Outdoor"
    operating_current:
      name: "Current"
    energy_consumption:
      state_class: total_increasing
      name: "Energy"
    operating_watt:
      name: "Power"
    error_code:
      name: "Error Code"

select:
  - platform: taixia
    type: airconditioner

    display_mode:
      id: sel_display_mode
      name: "面板燈光"
      options:
        "最亮": 0
        "稍暗": 1
        "關": 2

    motion_detect:
      id: sel_motion_detect
      name: "動向感應"
      options:
        "關閉": 0
        "對人": 1
        "不對人": 2
        "自動": 3

    swing_vertical_level:
      id: sel_swing_vert
      name: "上下擺動位置"
      options:
        "自動擺動": 0
        "1上": 1
        "2中上": 2
        "3中": 3
        "4中下": 4
        "5下": 5

    swing_horizontal_level:
      id: sel_swing_horiz
      name: "左右擺動位置"
      options:
        "自動擺動": 0
        "1中": 1
        "2右偏左": 2
        "3左偏右": 3
        "4最左": 4
        "5左偏中": 5
        "6中偏右": 6
        "7最右": 7

switch:
  - platform: taixia
    type: airconditioner
    power:
      name: "Power Switch"
    beeper:
      name: "Buzzer"
    mildew_proof:
      name: "Mildew Proof"
    self_cleaning:
      name: "Self Cleaning"
    power_saving:
      name: "ECONAVI"
    air_purifier:
      name: "nanoeX"
    super_mode:
      name: "Boost"

text_sensor:
  - platform: version
    name: "ESPHome Version"
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      
  - platform: taixia
    sa_id:
      name: "SA ID"
      id: sa_id
    brand:
      name: "SA Brand"
    model:
      name: "SA Model"
    version:
      name: "SA Version"
    services:
      name: "SA Services"
    boost_mode:
      name: "Boost Mode"

binary_sensor:
  - platform: taixia
    type: airconditioner
    filter_notify:
      name: "Filter Notify"

  - platform: status
    name: "Status"

taixia:
  sa_id: 1
  response_time: 65000

time:
  - platform: homeassistant
    id: homeassistant_time
